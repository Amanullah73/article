{% extends 'main.html' %}

{% block content %}
<div class="container">

        {% for i in data %}

        <div class="card">

            <img src="{{ i.image }}" alt="">

            <h2>{{ i.title }}</h2>

            <h3>
                {{ i.desc|truncatewords:18 }}
            </h3>

            <a href="{% url 'event_read' i.id %}">
                Explore Event
            </a>

        </div>

        {% endfor %}

    </div>


{% endblock %}
